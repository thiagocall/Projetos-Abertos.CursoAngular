<p>forms works!</p>

<div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="row mb-2">
                <form [formGroup]="frm">
                    <div>
                        <label for="nome">Nome</label>
                        <input id="nome" class="form-control" formControlName="nome" type="text" >
                    </div>
                    <div>
                        <label for="endereco">Endereço:</label>
                        <input id="endereco" class="form-control" formControlName="endereco" type="text" >
                    </div>
                    <div>
                        <label for="email">E-mail:</label>
                        <input id="email" class="form-control" formControlName="email" type="text">
                    </div>
                </form>
            </div>
            <div class="row">
            </div>
            <button class="btn btn-primary" (click)="salvar()">
                Salvar
            </button>
        </div>
    </div>
</div>
